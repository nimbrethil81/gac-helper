name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The catalogue release ledger reads main's first-parent history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run syntax/static checks
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Verify committed migration baseline
        run: npm run baseline:verify

      - name: Verify Git-native catalogue source matches its release record
        run: npm run catalogue:release -- --check

      - name: Build and verify the static catalogue Pages artifact
        run: npm run catalogue:site -- --out "$RUNNER_TEMP/_site"
