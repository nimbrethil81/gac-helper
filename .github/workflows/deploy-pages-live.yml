name: Deploy Pages Live

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-live
  cancel-in-progress: false

jobs:
  deploy:
    # Migration safety guard: this workflow must remain inert until the source
    # repository has been renamed to nimbrethil81/gac-helper.
    if: github.repository == 'nimbrethil81/gac-helper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # The catalogue release ledger and retained releases are rebuilt
          # from main's history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dependency-free: no npm ci, network or credentials.
      - name: Preflight catalogue checks
        run: node --test tests/catalogue-source.test.js tests/catalogue-corrections.test.js tests/catalogue-release.test.js

      # App shell allow-list plus the static catalogue release. Fails on an
      # invalid schema, broken identity references, a release gate failure,
      # release.json drift, a ledger violation, a corrupted file or the budget.
      - name: Build allow-listed Pages artifact
        run: node scripts/catalogue-release.js site --out _site

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Check live catalogue before deployment
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/catalogue-release.js guard --site _site --url "$PAGES_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live catalogue
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/catalogue-release.js verify --site _site --url "$PAGES_URL" --timeout 900 --interval 20
