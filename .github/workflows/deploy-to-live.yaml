name: Deploy to Live

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the dev repository
      - name: Checkout dev repo
        uses: actions/checkout@v4
        with:
          path: dev

      # Step 2: Check out the public live repository
      - name: Checkout live repo
        uses: actions/checkout@v4
        with:
          repository: nimbrethil81/gac-helper
          token: ${{ secrets.LIVE_REPO_PAT }}
          path: live

      # Step 3: Sync only the files explicitly approved for public release.
      #
      # Everything not explicitly included is removed from the live repo.
      # Protect the live checkout's .git directory so rsync does not delete
      # the repository metadata when --delete-excluded is used.
      - name: Sync allow-listed public files to live
        run: |
          rsync -av --delete --delete-excluded \
            --filter='P /.git' \
            --filter='P /.git/**' \
            --include='/index.html' \
            --include='/app.js' \
            --include='/styles.css' \
            --include='/manifest.json' \
            --include='/service-worker.js' \
            --include='/icon-192.png' \
            --include='/icon-512.png' \
            --include='/README.md' \
            --include='/changelog.md' \
            --exclude='*' \
            dev/ live/

      # Step 4: Commit and push any resulting changes
      - name: Commit and push to live repo
        run: |
          cd live
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy from dev: ${{ github.sha }}"
          git push
