name: Roll Back Worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: Worker target
        type: choice
        required: true
        options:
          - development
          - production
      version_id:
        description: Previously verified Cloudflare Worker version ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: gac-helper-${{ inputs.target }}-deployment
  cancel-in-progress: false

jobs:
  rollback:
    if: inputs.target != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEVELOPMENT_BASE_URL: ${{ vars.CLOUDFLARE_DEVELOPMENT_BASE_URL }}
      CLOUDFLARE_PRODUCTION_BASE_URL: ${{ vars.CLOUDFLARE_PRODUCTION_BASE_URL }}
      TARGET: ${{ inputs.target }}
      VERSION_ID: ${{ inputs.version_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Roll back selected Worker
        run: |
          if [ "$TARGET" = "production" ]; then
            npx wrangler rollback "$VERSION_ID" --env production
          else
            npx wrangler rollback "$VERSION_ID"
          fi
      - name: Verify rolled-back Worker
        run: |
          if [ "$TARGET" = "production" ]; then
            node scripts/verify-worker-deployment.js "$CLOUDFLARE_PRODUCTION_BASE_URL" false
          else
            node scripts/verify-worker-deployment.js "$CLOUDFLARE_DEVELOPMENT_BASE_URL" true
          fi
